version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: loomai-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - loomai-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loomai-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/loomai
      - JWT_SECRET=supersecretkey123
      - JWT_EXPIRATION=24h
      - LOG_LEVEL=info
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-mock}
    depends_on:
      - mongodb
    networks:
      - loomai-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loomai-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - loomai-network

volumes:
  mongo-data:

networks:
  loomai-network:
    driver: bridge
