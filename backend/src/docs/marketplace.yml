paths:
  /products/search:
    get:
      summary: Search and filter products
      tags: [Marketplace]
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Text search for product name, fabric, or tags
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: minPrice
          schema:
            type: number
        - in: query
          name: maxPrice
          schema:
            type: number
        - in: query
          name: fabricType
          schema:
            type: string
        - in: query
          name: colors
          schema:
            type: string
          description: Comma-separated list of colors
        - in: query
          name: category
          schema:
            type: string
          description: Category ObjectId
        - in: query
          name: supplier
          schema:
            type: string
          description: Supplier ObjectId
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [newest, price_asc, price_desc, popular]
            default: newest
      responses:
        '200':
          description: Paginated product results
  /products/{id}:
    get:
      summary: Get product details
      tags: [Marketplace]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product details
  /products/featured:
    get:
      summary: Get featured products
      tags: [Marketplace]
      responses:
        '200':
          description: List of featured products
  /categories:
    get:
      summary: Get all categories
      tags: [Marketplace]
      responses:
        '200':
          description: List of categories
