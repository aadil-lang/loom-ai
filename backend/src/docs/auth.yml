components:
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    RegisterBuyerRequest:
      type: object
      required:
        - name
        - email
        - password
        - contactName
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        contactName:
          type: string
        phone:
          type: string
        sourcingPreferences:
          type: array
          items:
            type: string
    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            user:
              type: object
            accessToken:
              type: string
            refreshToken:
              type: string

paths:
  /auth/buyer/register:
    post:
      summary: Register a new Buyer
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterBuyerRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /auth/buyer/login:
    post:
      summary: Login for Buyer
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /auth/logout:
    post:
      summary: Logout the current user
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully
  /auth/me:
    get:
      summary: Get the current user profile
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user payload
